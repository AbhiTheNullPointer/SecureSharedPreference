plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.AbhiTheNullPointer.securesharedpreference.demo'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.AbhiTheNullPointer.secureprefs.demo'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':secureprefs')
}
