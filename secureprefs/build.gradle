plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace 'io.github.AbhiTheNullPointer.securesharedpreference'
    compileSdk 36

    defaultConfig {
        minSdk 23
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.AbhiTheNullPointer'
                artifactId = 'SecureSharedPreference'
                version = '1.0.0'

                pom {
                    name = 'SecureSharedPreference'
                    description = 'Encrypted SharedPreferences for Android using Android Keystore'
                    url = 'https://github.com/AbhiTheNullPointer/SecureSharedPreference'
                    licenses {
                        license {
                            name = 'MIT License'
                            url = 'https://github.com/AbhiTheNullPointer/SecureSharedPreference/blob/main/LICENSE'
                        }
                    }
                    developers {
                        developer {
                            id = 'AbhiTheNullPointer'
                            name = 'Abhi'
                        }
                    }
                    scm {
                        connection = 'scm:git:git://github.com/AbhiTheNullPointer/SecureSharedPreference.git'
                        developerConnection = 'scm:git:ssh://github.com/AbhiTheNullPointer/SecureSharedPreference.git'
                        url = 'https://github.com/AbhiTheNullPointer/SecureSharedPreference'
                    }
                }
            }
        }
    }
}
