name: Build and publish release assets

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build library and installable demo APK (debug-signed)
        run: ./gradlew --no-daemon :secureprefs:assembleRelease :app:assembleDebug

      - name: Name demo APK for the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: cp app/build/outputs/apk/debug/app-debug.apk "SecureSharedPreference-demo-${GITHUB_REF_NAME}.apk"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: secure-shared-preference-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            secureprefs/build/outputs/aar/secureprefs-release.aar
            app/build/outputs/apk/debug/app-debug.apk

      - name: Attach APK and AAR to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: SecureSharedPreference ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            secureprefs/build/outputs/aar/secureprefs-release.aar
            SecureSharedPreference-demo-${{ github.ref_name }}.apk

      - name: Publish APK from main to the rolling release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest-apk
          target_commitish: ${{ github.sha }}
          name: Latest APK
          body: |
            ## Download

            [Download the latest demo APK](https://github.com/${{ github.repository }}/releases/download/latest-apk/app-debug.apk)

            This APK is built from the latest successful build on the `main` branch and is replaced after each successful build.
          prerelease: true
          overwrite_files: true
          files: app/build/outputs/apk/debug/app-debug.apk
