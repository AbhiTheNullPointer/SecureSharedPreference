name: Build & Release

on:
  push:
    tags:
      - 'v*'          # fires on v1.0.0, v1.2.3, etc.
  workflow_dispatch:   # lets you trigger a build manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── JDK ──────────────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── Gradle wrapper permissions ────────────────────────────────────────────
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── Build library (AAR) ───────────────────────────────────────────────────
      - name: Build library AAR
        run: ./gradlew :secureprefs:assembleRelease

      # ── Build demo APK ────────────────────────────────────────────────────────
      - name: Build demo APK (debug — no signing needed)
        run: ./gradlew :app:assembleDebug

      # ── Upload AAR as workflow artifact ───────────────────────────────────────
      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: secureprefs-release-aar
          path: secureprefs/build/outputs/aar/secureprefs-release.aar

      # ── Upload APK as workflow artifact ───────────────────────────────────────
      - name: Upload demo APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: secureprefs-demo-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # ── Attach both to the GitHub Release (only on tag pushes) ───────────────
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            secureprefs/build/outputs/aar/secureprefs-release.aar
            app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
